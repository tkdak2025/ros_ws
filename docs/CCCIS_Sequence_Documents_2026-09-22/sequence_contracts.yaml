project: CCCIS
scope:
  job_unit: one_recipe_execution
  scheduler: false
  external_triggers_via_hmi: true
  start_transport: StartInspection_service_full_recipe

states:
  system: [SYSTEM_READY, RUNNING, PAUSED, STOPPED, ERROR]
  judgment: [PENDING, COMPLETED, ERROR]
  inspection_result: [PASS, FAIL, SYSTEM_ERROR]
  pull_termination: [FORCE_LIMIT, MAX_DISTANCE, TIMEOUT, MOTION_ERROR, ROBOT_ERROR, TOOL_ERROR, SAFETY_ERROR, INVALID_DATA]

parameters:
  max_escape_distance_mm: 30.0
  adaptive_grip:
    max_entry_distance_mm: 25.0
    timeout_sec: 10.0
    entry_force_guard_n: 5.0
  pull:
    max_distance_mm: 25.0
    timeout_sec: 10.0
    speed_mm_s: recipe
    required_force_n:
      LAN: 15.0
      USB: 12.0
  judgment:
    displacement_limit_mm: 5.0

hmi_triggers:
  - START
  - PAUSE
  - RESUME
  - STOP
  - HOME_RETURN

point_runtime_fields:
  - point_id
  - motion_status
  - peak_pull_force
  - pull_displacement
  - termination_reason
  - judgment_status
  - result
  - reason
  - log_saved

# 2026-09-23 confirmed contracts
home_return:
  inside: [open_25mm_and_verify_idle, reverse_current_tool_z_30mm_target_verified, work_access, configured_home_route]
  outside: [configured_home_route]
  current_route: direct_zero_joint_home
  home_joint_tolerance_deg: 0.1
point_transition:
  ready: movej
  entry: movel_target_reached_required
completion:
  allowed_results: [PASS, FAIL]
  judgment_status: COMPLETED
  reject_system_error_or_incomplete: true
